<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Авторские футболки — вышивка и бисер</title>
<meta name="description" content="Авторские футболки ручной работы: вышивка, бисер, надпись. Лимитированные вещи.">
<meta property="og:title" content="Авторские футболки">
<meta property="og:description" content="Вышивка и бисер. Одна надпись — одна вещь.">
<meta property="og:image" content="media/venzel.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alumni+Sans:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Great+Vibes&family=Manrope:wght@400;500;600&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg class="filters" aria-hidden="true">
  <filter id="liquid" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="2" seed="3" result="n">
      <animate attributeName="baseFrequency" dur="18s" values="0.008 0.02;0.014 0.028;0.008 0.02" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<header class="top">
  <a class="mark" href="#film">Футболки</a>
  <nav>
    <a href="#atelier">Вешалка</a>
    <a href="#zakaz">Заказать</a>
  </nav>
</header>

<main id="film" class="film" style="--n:10">
  <div class="stage">
    <div class="wash" id="wash"></div>
    <div class="layers" id="layers">
      <figure class="layer is-on" data-i="0"><img src="media/venzel.jpg" alt="Чёрная футболка с красным бисерным вензелем" style="object-position:center 28%"></figure>
      <figure class="layer" data-i="1"><img src="media/venzel.jpg" alt="Крупный план красного вензеля" style="object-position:center 42%"></figure>
      <figure class="layer" data-i="2"><img src="media/posters/meteli-photo.jpg" alt="Белая футболка: И не такие метели в ебало летели" style="object-position:center 38%"></figure>
      <figure class="layer" data-i="3"><img src="media/posters/money-photo.jpg" alt="Светлая футболка: Я здесь только ради денег" style="object-position:center 32%"></figure>
      <figure class="layer" data-i="4"><img src="media/posters/vedma.jpg" alt="Чёрная футболка с надписью Ведьма" style="object-position:center 40%"></figure>
      <figure class="layer" data-i="5"><img src="media/posters/shepchet.jpg" alt="Ведьма шьёт — лес слушает" style="object-position:center 42%"></figure>
      <figure class="layer" data-i="6"><img src="media/posters/verhov.jpg" alt="Верховная ведьма" style="object-position:center 38%"></figure>
      <figure class="layer" data-i="7"><img src="media/posters/russian.jpg" alt="Russian Girl алыми буквами" style="object-position:center 40%"></figure>
      <figure class="layer" data-i="8"><img src="media/prosecco.jpg" alt="Prosecco mood" style="object-position:center 30%"></figure>
      <figure class="layer" data-i="9">
        <video src="media/reel/hoop-live.mp4" poster="media/hoop.jpg" muted playsinline loop preload="metadata" style="object-position:center 45%"></video>
      </figure>
    </div>
    <div class="veil"></div>
    <div class="copy">
      <p class="kicker" id="kicker">вышивка · бисер</p>
      <h1 class="title face-serif" id="title">Авторские футболки</h1>
      <p class="line" id="line">Одна надпись. Одна вещь.</p>
    </div>
    <p class="count" id="count">01 / 10</p>
    <p class="hint">листай</p>
  </div>
</main>

<section class="atelier" id="atelier">
  <p class="kicker">потяни за ткань</p>
  <h2>На вешалке</h2>
  <div class="rail"></div>
  <div class="row" id="rack"></div>
</section>

<footer class="end" id="zakaz">
  <p class="kicker">заказ</p>
  <h2 class="face-serif">Вещь, которой нет второй</h2>
  <p class="end-line">Пишите в Instagram или ВКонтакте — подберём размер и надпись.</p>
  <div class="links">
    <a class="btn ig" href="https://www.instagram.com/kiyaeva_irina" target="_blank" rel="noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4zm5 4.6A4.4 4.4 0 1 0 16.4 12 4.4 4.4 0 0 0 12 7.6zm0 7.2A2.8 2.8 0 1 1 14.8 12 2.8 2.8 0 0 1 12 14.8zM17.7 6.2a1.05 1.05 0 1 0 1.05 1.05 1.05 1.05 0 0 0-1.05-1.05z"/></svg>
      Instagram
    </a>
    <a class="btn vk" href="https://vk.ru/i.kiaeva" target="_blank" rel="noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.2 18s.3-2.1.4-2.4c.2-.6 1.3-1.3 1.3-1.3s2.8 2.6 3.5 3.2c1.4 1.2 2.5.9 2.5.9l5-.1s.3-.1.4-.3c.1-.2.1-.6-.1-.9-1.6-2.3-3.6-4.2-3.7-4.4-.1-.1-.1-.3.1-.5.4-.5 1-1.1 1.6-1.8 1-.1.2 1.6 2.3 2.4 2.8 0 .1.2 0 .3-.2.6-1.1 1.4-3.1 1.5-4.2 0-.2-.1-.3-.3-.3h-3.6c-.2 0-.4.1-.5.3-.4 1.2-1 2.9-1.2 3.3-.4.9-.6.7-.9.4-.4-.4-.7-1.1-.9-1.7-.4-1.1-.7-2.1-1.8-2.1H8.6c-.3 0-.5.2-.5.5 0 .6.8.7 1.1 2.2.7 3.4 2.1 6.4 2.1 6.4z" transform="translate(-4 -3) scale(.92)"/></svg>
      ВКонтакте
    </a>
  </div>
  <p class="fine">Ира Кияева · вышивка · бисер · надпись</p>
</footer>

<script>
const scenes = [
  { title: "Авторские футболки", kicker: "вышивка · бисер", line: "Одна надпись. Одна вещь.", face: "serif", wash: "#1a1012" },
  { title: "Вензель", kicker: "красный стеклярус", line: "Буква собрана бусина к бусине.", face: "gothic", wash: "#14080a" },
  { title: "И не такие метели", kicker: "скоропись по белому", line: "На ткани целиком: «И не такие метели в ебало летели».", face: "cursive", wash: "#1c1712" },
  { title: "Я здесь только ради денег", kicker: "розовая нить", line: "Каждая буква написана, не напечатана.", face: "cursive", wash: "#21181a" },
  { title: "Ведьма", kicker: "чёрное по чёрному", line: "Надпись почти тонет в ткани, пока не поймает свет.", face: "cursive", wash: "#0d0d0d" },
  { title: "Ведьма шьёт", kicker: "лес слушает", line: "Красные нити свисают с букв.", face: "block", wash: "#12090b" },
  { title: "Верховная ведьма", kicker: "красное и серебро", line: "Две нити в одной надписи.", face: "block", wash: "#14090c" },
  { title: "Russian Girl", kicker: "алый блок", line: "Латиница. Каждая буква посажена вручную.", face: "block", wash: "#16080a" },
  { title: "Prosecco mood", kicker: "чёрное по алому", line: "Блок и скоропись в одной строке.", face: "cursive", wash: "#3a0f16" },
  { title: "Пяльцы", kicker: "как это шьётся", line: "Ткань натянута. Рука держит ритм.", face: "serif", wash: "#16120f" }
];

const hangers = [
  { name: "Вензель", src: "media/venzel.jpg", pos: "center 35%" },
  { name: "Метели", src: "media/posters/meteli-photo.jpg", pos: "center 40%" },
  { name: "Ради денег", src: "media/posters/money-photo.jpg", pos: "center 30%" },
  { name: "Ведьма", src: "media/posters/vedma.jpg", pos: "center 42%" },
  { name: "Шьёт", src: "media/posters/shepchet.jpg", pos: "center 44%" },
  { name: "Верховная", src: "media/posters/verhov.jpg", pos: "center 40%" },
  { name: "Russian Girl", src: "media/posters/russian.jpg", pos: "center 42%" },
  { name: "Prosecco", src: "media/prosecco.jpg", pos: "center 28%" },
  { name: "Скоропись", src: "media/posters/white.jpg", pos: "center 40%" }
];

const layers = [...document.querySelectorAll(".layer")];
const title = document.getElementById("title");
const kicker = document.getElementById("kicker");
const line = document.getElementById("line");
const count = document.getElementById("count");
const wash = document.getElementById("wash");
const film = document.getElementById("film");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let last = -1;

function tick() {
  const rect = film.getBoundingClientRect();
  const total = film.offsetHeight - innerHeight;
  const scrolled = Math.min(total, Math.max(0, -rect.top));
  const p = total ? (scrolled / total) * (scenes.length - 1) : 0;
  const i = Math.min(scenes.length - 1, Math.floor(p + 0.0001));
  const t = Math.min(1, Math.max(0, p - Math.floor(p)));
  const s = t * t * (3 - 2 * t);
  layers.forEach((el, n) => {
    const on = n === i || n === i + 1;
    el.classList.toggle("is-on", on);
    if (n === i) {
      el.style.opacity = String(1 - s);
      el.style.transform = `scale(${1 + s * 0.08})`;
    } else if (n === i + 1) {
      el.style.opacity = String(s);
      el.style.transform = `scale(${1.08 - s * 0.08})`;
    } else {
      el.style.opacity = "0";
    }
    const vid = el.querySelector("video");
    if (vid) {
      if (on && vid.paused) vid.play().catch(() => {});
      if (!on && !vid.paused) vid.pause();
    }
  });
  if (i !== last) {
    last = i;
    const sc = scenes[i];
    title.textContent = sc.title;
    title.className = "title face-" + sc.face;
    kicker.textContent = sc.kicker;
    line.textContent = sc.line;
    count.textContent = String(i + 1).padStart(2, "0") + " / " + String(scenes.length).padStart(2, "0");
    wash.style.background = sc.wash;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const rack = document.getElementById("rack");
hangers.forEach((h) => {
  const el = document.createElement("article");
  el.className = "tee";
  el.innerHTML = `<div class="hook" aria-hidden="true"></div>
    <button type="button" class="body" aria-label="${h.name}">
      <img src="${h.src}" alt="${h.name}" style="object-position:${h.pos}" draggable="false">
    </button>
    <p>${h.name}</p>`;
  rack.appendChild(el);
  const btn = el.querySelector(".body");
  let rot = 0, vel = 0, px = 0, drag = false;
  const apply = () => { btn.style.transform = `rotateY(${rot}deg) rotateZ(${rot * 0.04}deg)`; };
  const loop = () => {
    if (!drag) {
      vel += -rot * 0.08;
      vel *= 0.86;
      rot += vel;
      if (Math.abs(rot) < 0.05 && Math.abs(vel) < 0.05) { rot = 0; vel = 0; }
      apply();
    }
    if (Math.abs(rot) > 0.05 || drag) requestAnimationFrame(loop);
  };
  const start = (x) => { drag = true; px = x; el.classList.add("is-hold"); loop(); };
  const move = (x) => { if (!drag) return; const d = x - px; px = x; rot += d * 0.35; rot = Math.max(-42, Math.min(42, rot)); apply(); };
  const end = () => { drag = false; el.classList.remove("is-hold"); };
  btn.addEventListener("pointerdown", (e) => { btn.setPointerCapture(e.pointerId); start(e.clientX); });
  btn.addEventListener("pointermove", (e) => move(e.clientX));
  btn.addEventListener("pointerup", end);
  btn.addEventListener("pointercancel", end);
});
</script>
</body>
</html>
