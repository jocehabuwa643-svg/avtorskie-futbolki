 "block", "src": "media/posters/shepchet.jpg", "alt": "Ведьма шьёт, лес слушает", "bead": "#8a1c28", "pos": "center 42%"}, {"id": "verhov", "title": "Верховная ведьма", "kicker": "красное и серебро", "line": "Две нити в одной надписи. Буквы не повторяются.", "face": "block", "src": "media/posters/verhov.jpg", "alt": "Верховная ведьма", "bead": "#8a2430"}, {"id": "russian", "title": "Russian Girl", "kicker": "алый блок", "line": "Латиница. Каждая буква посажена вручную.", "face": "block", "src": "media/posters/russian.jpg", "alt": "Russian Girl", "bead": "#c01828"}, {"id": "prosecco", "title": "Prosecco mood", "kicker": "чёрный по алому", "line": "Блок и скоропись в одной строке. Серия короткая.", "face": "cursive", "src": "media/prosecco.jpg", "alt": "Prosecco mood", "bead": "#1a1a1a", "pos": "center 28%"}, {"id": "white", "title": "Скоропись", "kicker": "белый хлопок", "line": "Коричневая нить. Край буквы не машинный.", "face": "script", "src": "media/posters/white.jpg", "alt": "Белая футболка, рукописная вышивка", "bead": "#b8895a"}, {"id": "macro", "title": "Нить", "kicker": "камера ближе", "line": "Стежок виден. Ткань держит рисунок одна.", "face": "script", "src": "media/posters/white-close.jpg", "alt": "Макро вышивки", "bead": "#c4a07a", "pos": "center 45%"}, {"id": "letter", "title": "Буква", "kicker": "стеклярус", "line": "Сначала карандаш. Потом стекло, стежок к стежку.", "face": "gothic", "src": "media/letter.jpg", "alt": "Серебряный стеклярус", "bead": "#c9cdd2"}, {"id": "fringe", "title": "Бахрома", "kicker": "нить", "line": "Нити висят отдельно. На каждой — капля стекла.", "face": "script", "src": "media/fringe.jpg", "alt": "Нити бисера", "bead": "#9a2030"}, {"id": "hoop", "title": "Пяльцы", "kicker": "процесс", "line": "Ткань натянута. Рука держит ритм, не скорость.", "face": "script", "src": "media/posters/hoop-live.jpg", "alt": "Рука на пяльцах", "bead": "#8a1c28", "video": "media/reel/hoop-live.mp4"}, {"id": "ira", "title": "Ира Кияева", "kicker": "автор", "line": "Нить идёт из руки, не из станка.", "face": "script", "src": "media/posters/hands-live.jpg", "alt": "Руки Иры Кияевой", "bead": "#c4b49a", "video": "media/reel/hands-live.mp4"}];
const hex = (h) => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const svg = document.getElementById("beads");
const dots = [...svg.querySelectorAll("circle")];
const film = document.getElementById("film");
const layers = [...document.querySelectorAll("[data-layer]")];
const title = document.getElementById("title");
const kicker = document.getElementById("kicker");
const line = document.getElementById("line");
const count = document.getElementById("count");
const meter = document.getElementById("meter");
const hint = document.getElementById("hint");
let color = hex(scenes[0].bead);
let target = hex(scenes[0].bead);
let beads = [];
const spawn = (w,h) => ({x:w*(0.32+Math.random()*0.36), y:h*(0.28+Math.random()*0.3), z:0.4+Math.random()*1.8, vx:(Math.random()-0.5)*0.7, vy:(Math.random()-0.5)*0.45, vz:-(0.01+Math.random()*0.02), settle:Math.random()>0.62});
const resize = () => {
  svg.setAttribute("viewBox", `0 0 ${innerWidth} ${innerHeight}`);
  if (!beads.length && !reduce) beads = dots.map(() => spawn(innerWidth, innerHeight));
};
resize();
addEventListener("resize", resize);
const cloths = [...document.querySelectorAll("[data-cloth]")];
const phys = cloths.map(() => ({rx:0,ry:0,rz:0,vx:0,vy:0,vz:0,grab:false,lx:0,ly:0}));
cloths.forEach((el,i) => {
  const st = phys[i];
  el.addEventListener("pointerdown", (e) => { el.setPointerCapture(e.pointerId); st.grab=true; st.lx=e.clientX; st.ly=e.clientY; });
  el.addEventListener("pointermove", (e) => {
    if (!st.grab) return;
    const dx = e.clientX-st.lx, dy = e.clientY-st.ly;
    st.ry += dx*0.45; st.rx += dy*0.16; st.vz += dx*0.02; st.lx=e.clientX; st.ly=e.clientY;
  });
  const up = () => { st.grab=false; };
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
});
let shown = "";
const paint = (scene,n) => {
  if (shown===scene.id) return;

    el.style.transform = "scale("+scale+")";
    const video = el.querySelector("video");
    if (video) { if (opacity>0.2) video.play().catch(()=>{}); else video.pause(); }
  });

      const size = Math.max(0.6, 16/bead.z);
      const alpha = Math.max(0, Math.min(0.9, 1.15-bead.z*0.4));
      const flicker = 0.55+Math.sin(now/160+bead.x*0.02)*0.45;
      dot.setAttribute("cx", bead.x); dot.setAttribute("cy", bead.y);
      dot.setAttribute("r", size*0.09);
      dot.setAttribute("fill", "rgba("+(r|0)+","+(g|0)+","+(b|0)+","+(alpha*flicker)+")");
    });
  }
  phys.forEach((st,i) => {
    if (!st.grab && !reduce) {
      const idle = Math.sin(now/900+i)*1.6;
      st.vx += -st.rx*0.045; st.vy += -st.ry*0.04; st.vz += (idle-st.rz)*0.035;
      st.vx*=0.86; st.vy*=0.88; st.vz*=0.88;
      st.rx+=st.vx; st.ry+=st.vy; st.rz+=st.vz;
    }
    const el = cloths[i];
    if (el) el.style.transform = "rotateX("+st.rx+"deg) rotateY("+st.ry+"deg) rotateZ("+st.rz+"deg)";
  });
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
</script>
</body>
