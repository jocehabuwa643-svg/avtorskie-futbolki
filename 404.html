<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не нашлась — авторские футболки</title>
<style>
  html { background: #f1ede7; color: #171412; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 500 1.05rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  i { display: block; width: 18px; height: 18px; margin: 0 auto 1.6rem; border-radius: 50%; background: #c8283c; box-shadow: inset 3px 3px 0 -1px rgba(255, 255, 255, .5); }
  h1 { margin: 0 0 .6rem; font: italic 500 clamp(2.2rem, 9vw, 4rem)/1 Georgia, "Times New Roman", serif; }
  p { margin: 0 auto; max-width: 24em; color: #6a6158; }
  a { display: inline-flex; align-items: center; min-height: 48px; margin-top: 1.8rem; padding: 0 1.4rem; border-radius: 999px; background: #171412; color: #f1ede7; text-decoration: none; font-weight: 600; letter-spacing: .04em; }
  @media (prefers-color-scheme: dark) { html { background: #11100f; color: #efe9e2; } p { color: #a69c91; } a { background: #efe9e2; color: #11100f; } }
</style>
</head>
<body>
<main>
  <i aria-hidden="true"></i>
  <h1>Нитка оборвалась</h1>
  <p>Такой страницы нет. Все футболки, гардероб и контакты Иры — на главной.</p>
  <a href="/avtorskie-futbolki/">К футболкам</a>
</main>
</body>
</html>
