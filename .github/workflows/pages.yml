name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
# по умолчанию токену разрешено только чтение; права на выкладку есть лишь у задания deploy
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # действия закреплены по хешу коммита: подмена тега у автора действия сюда не попадёт (обновляет Dependabot)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Проверить сайт перед выкладкой
        run: node .github/check.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Собрать статику
        run: |
          mkdir -p _site
          cp -a index.html 404.html styles.css site.js manifest.webmanifest .nojekyll film fonts _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
